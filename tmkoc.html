<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMKOC</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #111, #333);
            color: white;
            text-align: center;
        }

        nav {
            background: #ff4d4d;
            padding: 15px;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 2px;
        }

        h1 {
            margin-top: 25px;
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: 2px;
        }

        a.goBack {
            display: inline-block;
            margin-top: 10px;
            color: #ff4d4d;
            font-weight: 600;
            font-size: 1.2rem;
            text-decoration: none;
            border: 2px solid #ff4d4d;
            padding: 8px 15px;
            border-radius: 10px;
            transition: 0.3s;
        }

        a.goBack:hover {
            background: #ff4d4d;
            color: white;
        }

        .video-container {
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 25px;
            padding: 0 25px 50px 25px;
            max-width: 1200px;
        }

        iframe {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            border: 3px solid #ff4d4d;
            transition: 0.3s;
        }

        iframe:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 25px rgba(255, 77, 77, 0.4);
        }
    </style>
</head>

<body>

    <nav>DF YOUTUBE</nav>

    <h1>TMKOC Videos</h1>
    <a href="index.html" class="goBack">⬅ Go Back</a>

    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/WHEGHu7MCYA?si=E81c__WJ9oAjYLZ9" allowfullscreen></iframe>

        <iframe src="https://www.youtube.com/embed/xCp782Qzzfo?si=WSjGVWLXfE-auhsN" allowfullscreen></iframe>

        <iframe src="https://www.youtube.com/embed/mzg_32cxi9c?si=QcONoc20FfMrKm7r" allowfullscreen></iframe>

        <iframe src="https://www.youtube.com/embed/AQO_MDG65DM?si=2xLT-eBcJE0OFhuV" allowfullscreen></iframe>

        <iframe src="https://www.youtube.com/embed/wwVHjiOjurI?si=mhM1_D6dm0uWvm_C" allowfullscreen></iframe>
    </div>

</body>

</html>
